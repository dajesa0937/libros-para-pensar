[build]
  publish = "web"
  command = "npm test"

# Para regenerar el sitio desde los manuscritos en cada build, usar:
#   command = "npm run generar && npm test"
# Requiere Python 3 en la imagen de build (variable PYTHON_VERSION).

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/libro"
  to = "/fabricantes-de-sed.html"
  status = 301

[[redirects]]
  from = "/book"
  to = "/thirst-makers.html"
  status = 301

[[redirects]]
  from = "/en"
  to = "/index-en.html"
  status = 301
